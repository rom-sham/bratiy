model: outputs/cpt_merged
revision: null
tokenizer: outputs/cpt_merged
train_file: data/processed/sft_train.jsonl
validation_file: data/processed/sft_validation.jsonl
output_dir: outputs/sft_adapter
merged_dir: outputs/final_merged
seed: 3407
max_length: 1024
packing: false
lora: {r: 16, lora_alpha: 32, lora_dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
training:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00005
  warmup_ratio: 0.03
  num_train_epochs: 2
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  eval_strategy: steps
  save_total_limit: 3
  report_to: none
prefer_bf16: true
prefer_8bit_optimizer: true
min_free_vram_gib: 3
device: auto
